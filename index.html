<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080A14" />
    <meta
      name="description"
      content="健康重启计划：面向高血压、高血脂、糖尿病前期和体重管理人群的 AI 健康管理官网。"
    />
    <meta property="og:title" content="健康重启计划 · HealthResetPlan" />
    <meta
      property="og:description"
      content="从健康指标到 AI 计划，再到提醒打卡和趋势复盘的一体化健康管理平台。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jkcqplan.com/" />
    <title>健康重启计划 · HealthResetPlan</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/FinalBaseMesh.obj" as="fetch" crossorigin />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #080a14;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #app-skeleton {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: #dff9ff;
        background:
          linear-gradient(rgba(32, 198, 240, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(32, 198, 240, 0.06) 1px, transparent 1px),
          #080a14;
        background-size: 64px 64px;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      #app-skeleton.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      .sk-loader {
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      .sk-mark {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        color: #06111f;
        font-weight: 900;
        border-radius: 8px;
        background: linear-gradient(135deg, #20c6f0, #9c7cff);
        box-shadow: 0 0 34px rgba(32, 198, 240, 0.24);
      }

      .sk-text {
        color: rgba(223, 249, 255, 0.74);
        font-size: 14px;
        letter-spacing: 0.08em;
      }

      .sk-line {
        width: 180px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #20c6f0, transparent);
        animation: sk-scan 1.2s ease-in-out infinite;
      }

      @keyframes sk-scan {
        50% {
          opacity: 0.35;
          transform: scaleX(0.72);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-skeleton" role="status" aria-label="页面加载中">
      <div class="sk-loader">
        <div class="sk-mark">HR</div>
        <div class="sk-text">HealthResetPlan Loading</div>
        <div class="sk-line"></div>
      </div>
    </div>

    <div id="app"></div>

    <script>
      window.removeAppSkeleton = function () {
        var sk = document.getElementById('app-skeleton');
        if (!sk) return;
        sk.classList.add('fade-out');
        setTimeout(function () {
          if (sk) sk.remove();
        }, 400);
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
