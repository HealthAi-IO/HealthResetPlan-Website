<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080A14" />
    <meta
      name="description"
      content="健康重启计划：面向高血压、高血脂、糖尿病前期和体重管理人群的 AI 健康管理官网。"
    />
    <meta property="og:title" content="健康重启计划 · HealthResetPlan" />
    <meta
      property="og:description"
      content="从健康指标到 AI 计划，再到提醒打卡和趋势复盘的一体化健康管理平台。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jkcqplan.com/" />
    <title>健康重启计划 · HealthResetPlan</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/app-icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png" />
    <link rel="preload" href="/FinalBaseMesh.obj" as="fetch" crossorigin />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff9f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body:has(#app-skeleton) #app {
        opacity: 0;
      }

      #app-skeleton {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: #3a4240;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 200, 162, 0.22), transparent 28%),
          radial-gradient(circle at 82% 18%, rgba(143, 211, 185, 0.34), transparent 34%),
          linear-gradient(135deg, #fff9f0 0%, #fffaf4 48%, #e8f7ef 100%);
        transition: opacity 0.28s ease, visibility 0.28s ease;
      }

      #app-skeleton.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      .sk-loader {
        display: grid;
        gap: 16px;
        justify-items: center;
        padding: 34px 40px;
        border: 1px solid rgba(143, 211, 185, 0.34);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 0 24px 70px rgba(143, 211, 185, 0.18);
      }

      .sk-mark {
        width: 58px;
        height: 58px;
        overflow: hidden;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 16px 36px rgba(143, 211, 185, 0.34);
      }

      .sk-mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .sk-text {
        color: rgba(58, 66, 64, 0.78);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .sk-line {
        width: 220px;
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #8fd3b9, #ffc8a2, transparent);
        animation: sk-scan 1.2s ease-in-out infinite;
      }

      @keyframes sk-scan {
        50% {
          opacity: 0.35;
          transform: scaleX(0.72);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-skeleton" role="status" aria-label="页面加载中">
      <div class="sk-loader">
        <div class="sk-mark"><img src="/app-icon-192.png" alt="" /></div>
        <div class="sk-text">健康重启计划正在加载</div>
        <div class="sk-line"></div>
      </div>
    </div>

    <div id="app"></div>

    <script>
      window.removeAppSkeleton = function () {
        var sk = document.getElementById('app-skeleton');
        if (!sk) return;
        sk.classList.add('fade-out');
        setTimeout(function () {
          if (sk) sk.remove();
        }, 400);
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
